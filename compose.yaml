services:
  mariadb:
    image: 'mariadb:12.0.2'
    environment:
      - 'MARIADB_DATABASE=mydatabase'
      - 'MARIADB_PASSWORD=secret'
      - 'MARIADB_ROOT_PASSWORD=verysecret'
      - 'MARIADB_USER=myuser'
    ports:
      - "127.0.0.1:3306:3306"
  redis:
    image: 'redis:8.0.4-alpine'
    ports:
      - "127.0.0.1:6379:6379"

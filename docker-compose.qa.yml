services:
  # QA용 Spring Boot 애플리케이션
  pullit-qa-app:
    image: ${DOCKER_IMAGE}
    container_name: pullit-qa-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # Nginx 리버스 프록시만 접근 (외부 비공개)
    environment:
      # 데이터베이스 연결 설정
      - DB_URL=jdbc:mariadb://pullit-qa-db:3306/pullit_qa?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # Spring 프로필
      - SPRING_PROFILES_ACTIVE=qa
      # 외부 서비스 API 키 (CD 파이프라인에서 주입)
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - JWT_REDIRECT_URL=${JWT_REDIRECT_URL}
      - JWT_COOKIE_DOMAIN=${JWT_COOKIE_DOMAIN}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
      # JVM 옵션 (메모리 최적화)
      - JAVA_OPTS=-Xmx512m -Xms256m
      # Redis 연결 설정
      - REDIS_HOST=pullit-qa-redis
      - REDIS_PORT=6379
      # RabbitMQ 연결 설정
      - RABBITMQ_HOST=pullit-qa-rabbitmq
      - SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY=2 # 워커 수를 2로 고정하여 순차 처리
    depends_on:
      pullit-qa-db:
        condition: service_healthy
      pullit-qa-redis:
        condition: service_started
      pullit-qa-rabbitmq:
        condition: service_started
    networks:
      - pullit-qa-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # QA용 MariaDB 데이터베이스
  pullit-qa-db:
    image: mariadb:10.11
    container_name: pullit-qa-db
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=pullit_qa
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_CHARSET=utf8mb4
      - MARIADB_COLLATION=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - pullit_qa_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - pullit-qa-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --slow_query_log=1
      - --log_output=TABLE
      - --long_query_time=1

  # QA용 RabbitMQ 메시지 큐
  pullit-qa-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pullit-qa-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pullit-qa-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.qa.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9486:9090"
    networks:
      - pullit-qa-network

  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: unless-stopped
    volumes:
      - grafana_storage:/var/lib/grafana
    ports:
      - "127.0.0.1:9485:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    networks:
      - pullit-qa-network

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9487:9100"
    networks:
      - pullit-qa-network

  # QA용 Redis
  pullit-qa-redis:
    image: redis:8.0.4-alpine
    container_name: pullit-qa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pullit-qa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pullit_qa_data:
    driver: local
  grafana_storage:
    driver: local

networks:
  pullit-qa-network:
    driver: bridge

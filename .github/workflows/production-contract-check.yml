name: Check Pull-it production contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check isolated production configuration
    environment: pullit-production
    runs-on: ubuntu-latest
    steps:
      - name: Verify required names and secret presence without revealing values
        env:
          PULLIT_DB_USERNAME: ${{ vars.PULLIT_DB_USERNAME }}
          PULLIT_DATABASE_NAME: ${{ vars.PULLIT_DATABASE_NAME }}
          PULLIT_DB_VOLUME: ${{ vars.PULLIT_DB_VOLUME }}
          PULLIT_REDIS_VOLUME: ${{ vars.PULLIT_REDIS_VOLUME }}
          PULLIT_RABBITMQ_VOLUME: ${{ vars.PULLIT_RABBITMQ_VOLUME }}
          RABBITMQ_DEFAULT_USER: ${{ vars.RABBITMQ_DEFAULT_USER }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_REGION: ${{ vars.S3_REGION }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PULLIT_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.PULLIT_CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail

          required_variables=(
            PULLIT_DB_USERNAME
            PULLIT_DATABASE_NAME
            PULLIT_DB_VOLUME
            PULLIT_REDIS_VOLUME
            PULLIT_RABBITMQ_VOLUME
            RABBITMQ_DEFAULT_USER
            S3_BUCKET_NAME
            S3_REGION
          )
          required_secrets=(
            DB_PASSWORD
            DB_ROOT_PASSWORD
            RABBITMQ_DEFAULT_PASS
            JWT_SECRET_KEY
            KAKAO_REST_API_KEY
            KAKAO_CLIENT_SECRET
            GEMINI_API_KEY
            SENTRY_DSN
            PULLIT_CLOUDFLARE_TUNNEL_TOKEN
          )
          expected_variables=(
            'PULLIT_DB_USERNAME=pullit_app'
            'PULLIT_DATABASE_NAME=pullit'
            'PULLIT_DB_VOLUME=pullit-prod-db-data'
            'PULLIT_REDIS_VOLUME=pullit-prod-redis-data'
            'PULLIT_RABBITMQ_VOLUME=pullit-prod-rabbitmq-data'
            'RABBITMQ_DEFAULT_USER=pullit_app'
            'S3_BUCKET_NAME=pullit-portfolio-production-52685a79'
            'S3_REGION=ap-northeast-2'
          )

          missing=()
          for key in "${required_variables[@]}" "${required_secrets[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Pull-it production configuration keys: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          for expected in "${expected_variables[@]}"; do
            key="${expected%%=*}"
            value="${expected#*=}"
            if [[ "${!key}" != "$value" ]]; then
              printf 'Unexpected isolated production variable: %s\n' "$key" >&2
              exit 1
            fi
          done

          echo 'Pull-it production configuration contract is complete and isolated.'

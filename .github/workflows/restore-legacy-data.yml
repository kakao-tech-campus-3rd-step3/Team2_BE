name: Restore verified legacy Pull-it data

on:
  workflow_dispatch:
    inputs:
      backup_path:
        description: Absolute path of the verified SQL dump on the dedicated Pull-it EC2
        required: true
        type: string
      backup_sha256:
        description: SHA-256 of the verified SQL dump
        required: true
        type: string
      acknowledgement:
        description: Enter I_HAVE_VERIFIED_LEGACY_PULLIT_BACKUP exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pullit-legacy-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Bootstrap and restore into empty dedicated volumes
    environment: pullit-production
    runs-on: [self-hosted, Linux, X64, pullit-production]
    steps:
      - name: Check out the reviewed restore contract
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Validate and install the isolated restore contract
        env:
          DB_USERNAME: ${{ vars.PULLIT_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          PULLIT_DATABASE_NAME: ${{ vars.PULLIT_DATABASE_NAME }}
          PULLIT_DB_VOLUME: ${{ vars.PULLIT_DB_VOLUME }}
          PULLIT_REDIS_VOLUME: ${{ vars.PULLIT_REDIS_VOLUME }}
          PULLIT_RABBITMQ_VOLUME: ${{ vars.PULLIT_RABBITMQ_VOLUME }}
          RABBITMQ_DEFAULT_USER: ${{ vars.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
        run: |
          set -euo pipefail
          required=(
            DB_USERNAME DB_PASSWORD DB_ROOT_PASSWORD PULLIT_DATABASE_NAME
            PULLIT_DB_VOLUME PULLIT_REDIS_VOLUME PULLIT_RABBITMQ_VOLUME
            RABBITMQ_DEFAULT_USER RABBITMQ_DEFAULT_PASS
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '복원에 필요한 Pull-it 전용 값이 없습니다: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$DB_USERNAME" != pullit_app || "$PULLIT_DATABASE_NAME" != pullit || \
            "$PULLIT_DB_VOLUME" != pullit-prod-db-data || \
            "$PULLIT_REDIS_VOLUME" != pullit-prod-redis-data || \
            "$PULLIT_RABBITMQ_VOLUME" != pullit-prod-rabbitmq-data || \
            "$RABBITMQ_DEFAULT_USER" != pullit_app ]]; then
            echo '복원 대상이 고정된 Pull-it 전용 식별자와 일치하지 않습니다.' >&2
            exit 1
          fi
          umask 077
          runtime_env="$(mktemp)"
          trap 'rm -f "$runtime_env"' EXIT
          {
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'PULLIT_DATABASE_NAME=%s\n' "$PULLIT_DATABASE_NAME"
            printf 'PULLIT_DB_VOLUME=%s\n' "$PULLIT_DB_VOLUME"
            printf 'PULLIT_REDIS_VOLUME=%s\n' "$PULLIT_REDIS_VOLUME"
            printf 'PULLIT_RABBITMQ_VOLUME=%s\n' "$PULLIT_RABBITMQ_VOLUME"
            printf 'RABBITMQ_DEFAULT_USER=%s\n' "$RABBITMQ_DEFAULT_USER"
            printf 'RABBITMQ_DEFAULT_PASS=%s\n' "$RABBITMQ_DEFAULT_PASS"
            printf 'JWT_SECRET_KEY=restore-not-used\n'
            printf 'KAKAO_REST_API_KEY=restore-not-used\n'
            printf 'KAKAO_CLIENT_SECRET=restore-not-used\n'
            printf 'GEMINI_API_KEY=restore-not-used\n'
            printf 'S3_BUCKET_NAME=restore-not-used\n'
            printf 'SENTRY_DSN=restore-not-used\n'
          } > "$runtime_env"
          docker compose --env-file "$runtime_env" -f docker-compose.prod.yml config --quiet
          install -d -m 750 /opt/pullit
          install -m 640 docker-compose.prod.yml /opt/pullit/docker-compose.prod.yml
          install -m 750 ops/production/restore-legacy-database.sh /opt/pullit/restore-legacy-database.sh
          install -m 750 ops/production/bootstrap-legacy-restore.sh /opt/pullit/bootstrap-legacy-restore.sh
          install -m 600 "$runtime_env" /opt/pullit/pullit-production.env
      - name: Restore only into new dedicated Pull-it volumes
        env:
          PULLIT_RESTORE_ACK: ${{ inputs.acknowledgement }}
          BACKUP_PATH: ${{ inputs.backup_path }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
        run: /opt/pullit/bootstrap-legacy-restore.sh "$BACKUP_PATH" "$BACKUP_SHA256"

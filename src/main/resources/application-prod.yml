spring:
  application:
    name: pullit

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:?REDIS_HOST is required}
      port: ${REDIS_PORT:?REDIS_PORT is required}

  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 validate로 변경
    show-sql: false

  sql:
    init:
      mode: never

  # 프로덕션에서는 DevTools 비활성화
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

jwt:
  # Local development callback/domain values must never be accepted by the
  # portfolio deployment's OAuth success handler.
  authorized-redirect-uris:
    - ${JWT_REDIRECT_URL_1:https://portfolio.yeon.world/pull-it/login-success}
  authorized-cookie-domains:
    - ${JWT_COOKIE_DOMAIN_1:portfolio.yeon.world}

app:
  storage:
    s3:
      # Pi 내부 MinIO를 사용하며, public endpoint는 portfolio proxy를 거친다.
      endpoint: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      access-key: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      secret-key: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ${SERVER_SERVLET_SESSION_COOKIE_NAME:PULLIT_OAUTH_SESSION}
        path: ${SERVER_SERVLET_SESSION_COOKIE_PATH:/pull-it}
        same-site: none
        secure: true
  error:
    whitelabel:
      enabled: false
    include-exception: false  # 프로덕션에서는 예외 상세 정보 숨김
    include-stacktrace: NEVER
    include-message: always

info:
  app:
    name: Pullit Production
    description: Pullit 스터디 플랫폼 운영 환경

logging:
  level:
    root: info
    org.springframework.security: warn
    kr.it.pullit: info
  # 프로덕션 로그 파일 설정 (선택사항)
  # file:
  #   name: logs/pullit-prod.log

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: when-authorized  # 인증된 사용자만 상세 정보 확인

cors:
  allowed-origins:
    - ${ACCESS_CONTROL_ALLOWED_ORIGIN_1:https://portfolio.yeon.world}

sentry:
  dsn: ${SENTRY_DSN}
  send-default-pii: false

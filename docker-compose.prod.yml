x-pullit-common-environment: &pullit-common-environment
  DB_URL: jdbc:mariadb://pullit-prod-db:3306/pullit_prod?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: pullit-prod-redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: pullit-prod-rabbitmq
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
  KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
  KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-https://portfolio.yeon.world/pull-it/login/oauth2/code/kakao}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_REDIRECT_URL_1: ${JWT_REDIRECT_URL_1:-https://portfolio.yeon.world/pull-it/login-success}
  JWT_COOKIE_DOMAIN_1: ${JWT_COOKIE_DOMAIN_1:-portfolio.yeon.world}
  JWT_REFRESH_COOKIE_PATH: ${JWT_REFRESH_COOKIE_PATH:-/pull-it/auth/refresh}
  PULLIT_OAUTH2_REDIRECT_URI: ${PULLIT_OAUTH2_REDIRECT_URI:-https://portfolio.yeon.world/pull-it/login-success}
  ACCESS_CONTROL_ALLOWED_ORIGIN_1: ${ACCESS_CONTROL_ALLOWED_ORIGIN_1:-https://portfolio.yeon.world}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-pullit-uploaded-files}
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  JAVA_OPTS: ${JAVA_OPTS:--Xmx768m -Xms256m -XX:+UseG1GC}

x-pullit-runtime: &pullit-runtime
  image: ${PULLIT_BACKEND_IMAGE}
  restart: unless-stopped
  depends_on:
    pullit-prod-db:
      condition: service_healthy
    pullit-prod-redis:
      condition: service_healthy
    pullit-prod-rabbitmq:
      condition: service_healthy
  networks:
    - pullit-prod
  security_opt:
    - no-new-privileges:true

services:
  pullit-prod-app:
    <<: *pullit-runtime
    environment:
      <<: *pullit-common-environment
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:${PULLIT_BACKEND_PORT:-18082}:8080"
    networks:
      pullit-prod:
      yeon-edge:
        aliases:
          - pullit-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pullit-prod-worker:
    <<: *pullit-runtime
    environment:
      <<: *pullit-common-environment
      SPRING_PROFILES_ACTIVE: prod,worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: NONE
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -v grep | grep '[a]pp.jar'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  pullit-prod-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pullit_prod
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_CHARSET: utf8mb4
      MARIADB_COLLATION: utf8mb4_unicode_ci
    volumes:
      - pullit-prod-db:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - pullit-prod
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

  pullit-prod-redis:
    image: redis:8.0.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pullit-prod-redis:/data
    networks:
      - pullit-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  pullit-prod-rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - pullit-prod-rabbitmq:/var/lib/rabbitmq
    networks:
      - pullit-prod
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pullit-prod-db:
  pullit-prod-redis:
  pullit-prod-rabbitmq:

networks:
  pullit-prod:
  yeon-edge:
    name: yeon-edge
    external: true
